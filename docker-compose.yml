services:
  db:
    image: postgres:15-alpine
    container_name: proxi_db
    environment:
      POSTGRES_DB: ${DB_NAME:-proxi_dev}
      POSTGRES_USER: ${DB_USER:-proxi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiame_en_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - proxi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proxi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  proxi_pgdata:
