name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 09:00 UTC: dependencias y avisos nuevos aparecen sin que nadie empuje código
    - cron: '0 9 * * 1'

jobs:
  analisis-codigo:
    name: CodeQL (análisis estático)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secretos:
    name: Búsqueda de secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: un secreto borrado sigue estando en commits viejos
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Sin job de "npm audit" acá: `ci.yml` ya lo corre en cada push (estaba desde antes de este
  # workflow) y Dependabot (dependabot.yml) vigila lo mismo de forma continua — un tercer chequeo
  # idéntico solo gasta minutos de CI sin atrapar nada nuevo.
