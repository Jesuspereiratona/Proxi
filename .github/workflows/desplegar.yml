# Despliegue de la API. El orden importa y por eso no se deja en manos del autodespliegue de Render:
# primero las migraciones, después el código nuevo. Al revés, el código nuevo arranca contra un
# esquema viejo y falla en la primera petición.
#
# Las migraciones corren desde acá y no dentro del contenedor porque `sequelize-cli` es dependencia
# de desarrollo y no viaja en la imagen de producción (ver Dockerfile).
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez: dos corridas en paralelo podrían aplicar migraciones encimadas.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # Pide el entorno `produccion` de GitHub: ahí viven los secretos y, si se configura, la
    # aprobación manual antes de tocar la base real.
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Migraciones
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_URL: ${{ secrets.WEB_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          RUT_CIFRADO_KEY: ${{ secrets.RUT_CIFRADO_KEY }}
        run: npm run db:migrate -w apps/api

      - name: Desplegar en Render
        run: curl -sS --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" > /dev/null

      - name: Esperar a que la API responda con el código nuevo
        # Espera a ver ESTE commit en /salud, no solo a que la API conteste. Mientras Render
        # construye el contenedor nuevo —minutos— la instancia vieja sigue respondiendo 200, así que
        # preguntar "¿responde?" daba verde de inmediato y el paso no comprobaba nada (encontrado al
        # estrenar el despliegue: el flujo dio verde con la API vieja arriba hacía 972 segundos).
        run: |
          esperado=$(echo "${{ github.sha }}" | cut -c1-7)
          for intento in $(seq 1 40); do
            version=$(curl -sS --max-time 30 "${{ secrets.API_URL }}/api/v1/salud" | node -e "
              let d = '';
              process.stdin.on('data', (c) => { d += c; });
              process.stdin.on('end', () => { try { console.log(JSON.parse(d).version || ''); } catch { console.log(''); } });
            ")
            if [ "$version" = "$esperado" ]; then
              echo "Desplegado y verificado: $esperado"
              exit 0
            fi
            echo "intento $intento: corriendo '$version', esperando '$esperado'"
            sleep 15
          done
          echo "::error::El codigo nuevo no llego a produccion en 10 minutos. Revisar los logs de Render."
          exit 1
