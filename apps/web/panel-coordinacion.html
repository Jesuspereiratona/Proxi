<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de coordinación — Proxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
      <button id="boton-cerrar-sesion" class="btn btn-link p-0">Cerrar sesión</button>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="titular mb-4">Panel de coordinación</h1>
    <p id="mensaje-estado" role="status" hidden></p>

    <section class="mb-5">
      <h2 class="h4 mb-3">Empresas</h2>
      <div id="lista-empresas" class="d-flex flex-column gap-3" aria-live="polite"></div>
    </section>

    <section class="mb-5">
      <h2 class="h4 mb-3">Ofertas por revisar</h2>
      <div id="lista-ofertas" class="d-flex flex-column gap-3" aria-live="polite"></div>
    </section>

    <section>
      <h2 class="h4 mb-3">Indicadores</h2>
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
            <tr>
              <th scope="col">Empresa</th>
              <th scope="col">Tasa de respuesta</th>
              <th scope="col">Días promedio</th>
              <th scope="col">Tasa de cierre declarado</th>
              <th scope="col">Ofertas cerradas</th>
              <th scope="col">Ofertas publicadas (12m)</th>
            </tr>
          </thead>
          <tbody id="tabla-indicadores"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/paginas/panel-coordinacion.js"></script>
</body>
</html>
