<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis ofertas — Proxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
      <div class="d-flex gap-3">
        <a href="panel-empresa.html">Mi empresa</a>
        <button id="boton-cerrar-sesion" class="btn btn-link p-0">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="titular mb-0">Mis ofertas</h1>
      <button id="boton-nueva" type="button" class="btn btn-primary">Nueva oferta</button>
    </div>
    <p id="aviso-no-validada" class="text-body-secondary small" hidden></p>
    <p id="mensaje-estado" role="status" hidden></p>

    <section id="seccion-formulario" class="card card-oferta mb-4" hidden>
      <div class="card-body">
        <h2 class="h5 mb-3" id="titulo-formulario">Nueva oferta</h2>
        <form id="formulario-oferta" novalidate>
          <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input id="titulo" name="titulo" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="requisitos" class="form-label">Requisitos</label>
            <textarea id="requisitos" name="requisitos" class="form-control" rows="2" required></textarea>
          </div>
          <div class="mb-3">
            <label for="area" class="form-label">Área</label>
            <input id="area" name="area" class="form-control" required>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label for="modalidad" class="form-label">Modalidad</label>
              <select id="modalidad" name="modalidad" class="form-select" required>
                <option value="presencial">Presencial</option>
                <option value="hibrida">Híbrida</option>
                <option value="remota">Remota</option>
              </select>
            </div>
            <div class="col-6 mb-3">
              <label for="jornada" class="form-label">Jornada</label>
              <select id="jornada" name="jornada" class="form-select" required>
                <option value="completa">Completa</option>
                <option value="parcial">Parcial</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="comuna" class="form-label">Comuna</label>
            <input id="comuna" name="comuna" class="form-control" placeholder="Obligatoria salvo modalidad remota">
          </div>
          <div class="form-check mb-3">
            <input id="remunerada" name="remunerada" type="checkbox" class="form-check-input">
            <label for="remunerada" class="form-check-label">Remunerada</label>
          </div>
          <div class="mb-3">
            <label for="montoMensual" class="form-label">Monto mensual (CLP)</label>
            <input id="montoMensual" name="montoMensual" type="number" min="1" class="form-control">
          </div>
          <div class="mb-3">
            <label for="cupos" class="form-label">Cupos</label>
            <input id="cupos" name="cupos" type="number" min="1" class="form-control" value="1">
          </div>
          <div class="mb-3">
            <label for="fechaCierre" class="form-label">Fecha de cierre</label>
            <input id="fechaCierre" name="fechaCierre" type="date" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" id="boton-cancelar-formulario" class="btn btn-link">Cancelar</button>
        </form>
      </div>
    </section>

    <div id="lista" class="d-flex flex-column gap-3" aria-live="polite"></div>
  </main>

  <footer class="border-top py-3 mt-5 text-center small text-body-secondary">
    <p class="mb-0">¿Dudas sobre tus datos? Escríbenos a <a href="mailto:privacidad@proxi.cl">privacidad@proxi.cl</a>
      (dirección provisoria, pendiente casilla real de la FEN) · <a href="politica-privacidad.html">Política de privacidad</a></p>
  </footer>

  <script type="module" src="assets/js/paginas/mis-ofertas.js"></script>
</body>
</html>
