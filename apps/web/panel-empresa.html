<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi empresa — Proxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
      <div class="d-flex gap-3">
        <a href="mis-ofertas.html">Mis ofertas</a>
        <button id="boton-cerrar-sesion" class="btn btn-link p-0">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 600px;">
    <h1 class="titular mb-3">Mi empresa</h1>
    <p id="estado-validacion" class="mb-3"></p>
    <p id="mensaje-estado" role="status" hidden></p>

    <form id="formulario-perfil" method="post" novalidate>
      <div class="mb-3">
        <label for="razonSocial" class="form-label">Razón social</label>
        <input id="razonSocial" name="razonSocial" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="rutEmpresa" class="form-label">RUT de la empresa</label>
        <input id="rutEmpresa" name="rutEmpresa" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="giro" class="form-label">Giro</label>
        <input id="giro" name="giro" class="form-control">
      </div>
      <div class="mb-3">
        <label for="sitioWeb" class="form-label">Sitio web</label>
        <input id="sitioWeb" name="sitioWeb" type="url" class="form-control" placeholder="https://…">
      </div>
      <div class="mb-3">
        <label for="comuna" class="form-label">Comuna</label>
        <input id="comuna" name="comuna" class="form-control">
      </div>
      <div class="mb-3">
        <label for="contactoNombre" class="form-label">Nombre de contacto</label>
        <input id="contactoNombre" name="contactoNombre" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="contactoCargo" class="form-label">Cargo de contacto</label>
        <input id="contactoCargo" name="contactoCargo" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
  </main>

  <footer class="border-top py-3 mt-5 text-center small text-body-secondary">
    <p class="mb-0">¿Dudas sobre tus datos? Escríbenos a <a href="mailto:privacidad@proxi.cl">privacidad@proxi.cl</a>
      (dirección provisoria, pendiente casilla real de la FEN) · <a href="politica-privacidad.html">Política de privacidad</a></p>
  </footer>

  <script type="module" src="assets/js/paginas/panel-empresa.js"></script>
</body>
</html>
