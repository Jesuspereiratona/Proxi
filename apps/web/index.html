<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxi — Ofertas de práctica FEN UAH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
      <div id="nav-sesion" class="d-flex gap-3 align-items-center"></div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="titular mb-1">Ofertas de práctica vigentes</h1>
    <p class="text-body-secondary mb-3">Facultad de Economía y Negocios · Universidad Alberto Hurtado</p>

    <form id="filtros" class="buscador mb-3" aria-label="Filtrar ofertas">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-lg-4">
          <label for="filtro-area" class="form-label small mb-1">Área</label>
          <input type="text" id="filtro-area" name="area" class="form-control"
            placeholder="Contabilidad, Marketing, Finanzas…">
        </div>
        <div class="col-6 col-lg-2">
          <label for="filtro-modalidad" class="form-label small mb-1">Modalidad</label>
          <select id="filtro-modalidad" name="modalidad" class="form-select">
            <option value="">Todas</option>
            <option value="presencial">Presencial</option>
            <option value="hibrida">Híbrida</option>
            <option value="remota">Remota</option>
          </select>
        </div>
        <div class="col-6 col-lg-3">
          <label for="filtro-comuna" class="form-label small mb-1">Comuna</label>
          <input type="text" id="filtro-comuna" name="comuna" class="form-control" placeholder="Santiago, Providencia…">
        </div>
        <div class="col-6 col-lg-2">
          <label for="filtro-remunerada" class="form-label small mb-1">Remunerada</label>
          <select id="filtro-remunerada" name="remunerada" class="form-select">
            <option value="">Cualquiera</option>
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="col-6 col-lg-1 d-grid">
          <button type="button" id="limpiar-filtros" class="btn btn-outline-secondary">Limpiar</button>
        </div>
      </div>
    </form>

    <p id="contador" class="small text-body-secondary mb-2" aria-live="polite"></p>
    <p id="mensaje-estado" class="text-body-secondary" hidden></p>
    <div id="listado" class="d-flex flex-column gap-2" aria-live="polite"></div>
  </main>

  <footer class="border-top py-3 mt-5 text-center small text-body-secondary">
    <p class="mb-0">¿Dudas sobre tus datos? Escríbenos a <a href="mailto:uahmarketcl@gmail.com">uahmarketcl@gmail.com</a>
      (dirección provisoria, pendiente casilla real de la FEN) · <a href="politica-privacidad.html">Política de privacidad</a></p>
  </footer>

  <script type="module" src="assets/js/paginas/vitrina.js"></script>
</body>
</html>
