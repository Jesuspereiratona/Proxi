<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxi — Ofertas de práctica FEN UAH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="titular mb-4">Ofertas de práctica vigentes</h1>

    <form id="filtros" class="row g-2 mb-4" aria-label="Filtrar ofertas">
      <div class="col-6 col-md-3">
        <label for="filtro-area" class="form-label">Área</label>
        <input type="text" id="filtro-area" name="area" class="form-control">
      </div>
      <div class="col-6 col-md-3">
        <label for="filtro-modalidad" class="form-label">Modalidad</label>
        <select id="filtro-modalidad" name="modalidad" class="form-select">
          <option value="">Todas</option>
          <option value="presencial">Presencial</option>
          <option value="hibrida">Híbrida</option>
          <option value="remota">Remota</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label for="filtro-comuna" class="form-label">Comuna</label>
        <input type="text" id="filtro-comuna" name="comuna" class="form-control">
      </div>
      <div class="col-6 col-md-3">
        <label for="filtro-remunerada" class="form-label">Remunerada</label>
        <select id="filtro-remunerada" name="remunerada" class="form-select">
          <option value="">Cualquiera</option>
          <option value="true">Sí</option>
          <option value="false">No</option>
        </select>
      </div>
    </form>

    <p id="mensaje-estado" class="text-body-secondary" hidden></p>
    <div id="listado" class="row g-3" aria-live="polite"></div>
  </main>

  <script type="module" src="assets/js/paginas/vitrina.js"></script>
</body>
</html>
