<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta — Proxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 420px;">
    <h1 class="titular mb-4">Crear cuenta</h1>

    <form id="formulario-registro" method="post" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="rol" class="form-label">Eres</label>
        <select id="rol" name="rol" class="form-select" required>
          <option value="estudiante">Estudiante</option>
          <option value="empresa">Empresa</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input type="password" id="clave" name="clave" class="form-control" required minlength="12" autocomplete="new-password">
        <div class="form-text">Al menos 12 caracteres.</div>
      </div>
      <div class="mb-3">
        <label for="claveConfirmar" class="form-label">Confirmar contraseña</label>
        <input type="password" id="claveConfirmar" name="claveConfirmar" class="form-control" required minlength="12" autocomplete="new-password">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" id="aceptaPolitica" name="aceptaPolitica" class="form-check-input" required>
        <label for="aceptaPolitica" class="form-check-label">
          Acepto la <a href="politica-privacidad.html" target="_blank" rel="noopener">política de privacidad</a>
        </label>
      </div>
      <p id="mensaje-error" class="text-danger" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary">Crear cuenta</button>
    </form>

    <div id="mensaje-exito" class="alert alert-success mt-3" role="status" hidden></div>

    <p class="mt-3 small">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </main>

  <footer class="border-top py-3 mt-5 text-center small text-body-secondary">
    <p class="mb-0">¿Dudas sobre tus datos? Escríbenos a <a href="mailto:privacidad@proxi.cl">privacidad@proxi.cl</a>
      (dirección provisoria, pendiente casilla real de la FEN) · <a href="politica-privacidad.html">Política de privacidad</a></p>
  </footer>

  <script type="module" src="assets/js/paginas/registro.js"></script>
</body>
</html>
