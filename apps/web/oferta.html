<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de oferta — Proxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
    </div>
  </nav>

  <main class="container py-4">
    <p><a href="index.html">&larr; Volver a la vitrina</a></p>
    <p id="mensaje-estado" class="text-body-secondary" hidden></p>

    <article id="detalle" hidden>
      <span id="detalle-estado" class="estado-oferta"></span>
      <h1 id="detalle-titulo" class="titular mt-2"></h1>
      <p class="mb-3">
        <a id="detalle-empresa-enlace" href="#" class="fw-medium text-decoration-none"></a>
      </p>

      <dl class="row">
        <dt class="col-sm-3">Modalidad</dt>
        <dd class="col-sm-9" id="detalle-modalidad"></dd>
        <dt class="col-sm-3">Comuna</dt>
        <dd class="col-sm-9" id="detalle-comuna"></dd>
        <dt class="col-sm-3">Jornada</dt>
        <dd class="col-sm-9" id="detalle-jornada"></dd>
        <dt class="col-sm-3">Remuneración</dt>
        <dd class="col-sm-9" id="detalle-remuneracion"></dd>
      </dl>

      <h2 class="h5 mt-4">Descripción</h2>
      <p id="detalle-descripcion"></p>

      <h2 class="h5 mt-4">Requisitos</h2>
      <p id="detalle-requisitos"></p>
    </article>
  </main>

  <script type="module" src="assets/js/paginas/oferta.js"></script>
</body>
</html>
