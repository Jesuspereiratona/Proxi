<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil — Proxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
      <div class="d-flex gap-3">
        <a href="postulaciones.html">Mis postulaciones</a>
        <button id="boton-cerrar-sesion" class="btn btn-link p-0">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 600px;">
    <h1 class="titular mb-4">Mi perfil</h1>
    <p id="mensaje-estado" role="status" hidden></p>

    <form id="formulario-perfil" method="post" novalidate>
      <div class="mb-3">
        <label for="nombres" class="form-label">Nombres</label>
        <input id="nombres" name="nombres" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="apellidos" class="form-label">Apellidos</label>
        <input id="apellidos" name="apellidos" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="rut" class="form-label">RUT</label>
        <p id="rut-actual" class="text-body-secondary small mb-1" hidden></p>
        <input id="rut" name="rut" class="form-control" autocomplete="off">
      </div>
      <div class="mb-3">
        <label for="carrera" class="form-label">Carrera</label>
        <input id="carrera" name="carrera" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="nivel" class="form-label">Nivel</label>
        <input id="nivel" name="nivel" type="number" min="1" class="form-control">
      </div>
      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input id="telefono" name="telefono" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <hr class="my-4">
    <h2 class="h5">Currículum (CV)</h2>
    <p id="cv-estado"></p>
    <button id="boton-descargar-cv" class="btn btn-outline-secondary btn-sm" hidden>Descargar mi CV</button>
    <div class="mt-3">
      <label for="archivo-cv" class="form-label">Subir o reemplazar CV (PDF)</label>
      <input type="file" id="archivo-cv" accept="application/pdf" class="form-control">
      <button id="boton-subir-cv" type="button" class="btn btn-secondary btn-sm mt-2">Subir</button>
    </div>
  </main>

  <footer class="border-top py-3 mt-5 text-center small text-body-secondary">
    <p class="mb-0">¿Dudas sobre tus datos? Escríbenos a <a href="mailto:privacidad@proxi.cl">privacidad@proxi.cl</a>
      (dirección provisoria, pendiente casilla real de la FEN) · <a href="politica-privacidad.html">Política de privacidad</a></p>
  </footer>

  <script type="module" src="assets/js/paginas/panel-estudiante.js"></script>
</body>
</html>
