<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Proxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/uah-theme.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand titular" href="index.html">Proxi</a>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 420px;">
    <h1 class="titular mb-4">Iniciar sesión</h1>

    <!-- method="post": si el módulo de login.js no llega a ejecutarse por cualquier motivo, el
         envío nativo del navegador manda la clave en el cuerpo, no como query string en la URL
         (auditoría de sesión web — un GET con la clave en la URL queda en el historial del
         navegador y en cualquier log de acceso). -->
    <form id="formulario-login" method="post" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input type="password" id="clave" name="clave" class="form-control" required autocomplete="current-password">
      </div>
      <p id="mensaje-error" class="text-danger" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p class="mt-3 small">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </main>

  <script type="module" src="assets/js/paginas/login.js"></script>
</body>
</html>
